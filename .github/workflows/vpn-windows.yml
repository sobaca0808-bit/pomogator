name: ПОМОГАТОР VPN — эксперимент sing-box Windows x64

on:
  push:
    branches: [vpn-experimental-sing-box]
    paths:
      - windows/vpn/**
      - .github/workflows/vpn-windows.yml
  pull_request:
    paths:
      - windows/vpn/**
      - .github/workflows/vpn-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Build pinned sing-box with REALITY and Windows TUN patches
        shell: pwsh
        run: >-
          ./windows/vpn/sing-box/Build.ps1
          -Destination "$env:RUNNER_TEMP/pomogator-sing-box"
          -SourceDirectory "$env:RUNNER_TEMP/pomogator-sing-box-source"
      - name: Install pinned Xray
        shell: pwsh
        run: ./windows/vpn/scripts/Get-Xray.ps1 -Destination "$env:RUNNER_TEMP/pomogator-xray"
      - name: Test profiles, loopback VLESS and WinINet restoration
        shell: pwsh
        run: |
          $env:POMOGATOR_TEST_XRAY = Join-Path $env:RUNNER_TEMP 'pomogator-xray/xray.exe'
          # The runner is disposable. The test refuses to overwrite an active proxy.
          $env:POMOGATOR_TEST_WININET = '1'
          $env:POMOGATOR_TEST_SING_BOX = Join-Path $env:RUNNER_TEMP 'pomogator-sing-box/PomogatorTunCore.exe'
          # TUN CI adds only two documentation /32 routes and a documentation IPv6 filter in this disposable VM.
          $env:POMOGATOR_TEST_TUN = '1'
          dotnet run --project windows/vpn/tests/Tests.csproj -c Release
      - name: Test the same synthetic REALITY TCP profiles with Xray and sing-box
        shell: pwsh
        run: |
          python windows/vpn/tests/reality-smoke.py "$env:RUNNER_TEMP/pomogator-xray/xray.exe" "$env:RUNNER_TEMP/pomogator-sing-box/PomogatorTunCore.exe"
      - name: Verify WPF and tray, render screenshots
        shell: pwsh
        run: dotnet run --project windows/vpn/tests/ui/UiTests.csproj -c Release -- "$env:RUNNER_TEMP/pomogator-vpn-screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: PomogatorVpn-0.3.4-screenshots
          path: ${{ runner.temp }}/pomogator-vpn-screenshots/
          if-no-files-found: error
      - name: Build Windows x64 package
        shell: pwsh
        run: |
          dotnet publish windows/vpn/app/PomogatorVpn.csproj -c Release -r win-x64 --self-contained true -o windows/vpn/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/pomogator-xray/*" windows/vpn/dist
          Copy-Item "$env:RUNNER_TEMP/pomogator-sing-box/*" windows/vpn/dist
      - name: Package corresponding source with dependencies
        shell: pwsh
        run: >-
          tar.exe --exclude=.git -czf "$env:RUNNER_TEMP/pomogator-sing-box-source.tar.gz"
          -C "$env:RUNNER_TEMP/pomogator-sing-box-source" .
      - uses: actions/upload-artifact@v4
        with:
          name: Pomogator-sing-box-corresponding-source
          path: ${{ runner.temp }}/pomogator-sing-box-source.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PomogatorVpn-sing-box-experimental-win-x64
          path: windows/vpn/dist/
          if-no-files-found: error
