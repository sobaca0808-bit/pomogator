name: ПОМОГАТОР — проверка органайзера

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'e2e/**'
      - 'index.html'
      - 'package*.json'
      - '*config.ts'
      - 'tsconfig.json'
      - '.github/workflows/organizer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  organizer:
    runs-on: ubuntu-latest
    env:
      POMOGATOR_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=./
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: pomogator-organizer-v0.2
          path: |
            dist/
            screenshots/
          if-no-files-found: error
