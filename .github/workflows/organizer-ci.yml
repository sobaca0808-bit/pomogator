name: ПОМОГАТОР — проверка органайзера

on:
  push:
    branches: [organizer-v0.2-fixes, organizer-v0.2.1, organizer-v0.2.2]
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'e2e/**'
      - 'index.html'
      - 'package*.json'
      - '*config.ts'
      - 'tsconfig.json'
      - '.github/workflows/organizer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  organizer:
    runs-on: ubuntu-latest
    env:
      POMOGATOR_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=./
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: Pomogator-organizer-android-web-test
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pomogator-organizer-v0.2
          path: |
            dist/
            screenshots/
          if-no-files-found: error

  windows-package:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.windows-zip.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - run: npm ci
      - run: npm run build -- --base=./
      - name: Build the Windows x64 launcher
        shell: pwsh
        run: |
          Copy-Item dist windows/organizer/dist -Recurse
          New-Item -Type Directory package | Out-Null
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -o package/Pomogator.exe windows/organizer/main.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item windows/organizer/README.md package/
      - run: npx playwright install chromium
      - name: Test the packaged Windows executable
        run: npm run test:e2e
        env:
          POMOGATOR_TEST_EXE: package/Pomogator.exe
      - uses: actions/upload-artifact@v4
        id: windows-zip
        with:
          name: Pomogator-organizer-win-x64-test
          path: package/
          if-no-files-found: error

  android-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=./
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android Chrome
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: adb shell pm path com.android.chrome && adb reverse tcp:4182 tcp:4182 && npm run test:e2e -- --grep "Android Chrome"
        env:
          POMOGATOR_ANDROID: '1'
          DEBUG: pw:android

  request-pages:
    if: github.ref == 'refs/heads/organizer-v0.2-fixes'
    needs: [organizer, windows-package, android-chrome]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Publish the tested commit through the approved Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_id }}
          WINDOWS_ZIP: ${{ needs.windows-package.outputs.artifact-id }}
        run: |
          gh api "repos/$PROJECT/actions/workflows/organizer-pages-preview.yml/dispatches"             -f ref=organizer-v0.2-pages -f "inputs[source_sha]=$SOURCE_SHA"             -f "inputs[build_run]=$BUILD_RUN" -f "inputs[windows_zip]=$WINDOWS_ZIP"
