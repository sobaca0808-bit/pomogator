name: ПОМОГАТОР — проверка органайзера

on:
  push:
    branches: [organizer-v0.2-fixes]
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'e2e/**'
      - 'index.html'
      - 'package*.json'
      - '*config.ts'
      - 'tsconfig.json'
      - '.github/workflows/organizer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  organizer:
    runs-on: ubuntu-latest
    env:
      POMOGATOR_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=./
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: pomogator-organizer-v0.2
          path: |
            dist/
            screenshots/
          if-no-files-found: error

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - run: npm ci
      - run: npm run build -- --base=./
      - name: Build the Windows x64 launcher
        shell: pwsh
        run: |
          Copy-Item dist windows/organizer/dist -Recurse
          New-Item -Type Directory package | Out-Null
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -o package/Pomogator.exe windows/organizer/main.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item windows/organizer/README.md package/
      - run: npx playwright install chromium
      - name: Test the packaged Windows executable
        run: npm run test:e2e
        env:
          POMOGATOR_TEST_EXE: package/Pomogator.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Pomogator-organizer-win-x64-test
          path: package/
          if-no-files-found: error
