name: ПОМОГАТОР v0.2 — GitHub Pages

on:
  push:
    branches: [organizer-v0.2-pages]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Проверенный коммит ветки постоянного стенда
        type: string
      build_run:
        description: Номер прогона сборки
        type: string
      windows_zip:
        description: Номер ZIP Windows x64
        type: string

permissions:
  contents: read

concurrency:
  group: pomogator-pages
  cancel-in-progress: false

env:
  POMOGATOR_SOURCE_BRANCH: organizer-v0.2.5-glass
  PAGES_ROOT: https://sobaca0808-bit.github.io/pomogator/
  POMOGATOR_PAGES_URL: https://sobaca0808-bit.github.io/pomogator/preview-v0.2/
  POMOGATOR_022_URL: https://sobaca0808-bit.github.io/pomogator/preview-v0.2.2/
  POMOGATOR_023_URL: https://sobaca0808-bit.github.io/pomogator/preview-v0.2.3/
  POMOGATOR_024_URL: https://sobaca0808-bit.github.io/pomogator/preview-v0.2.4/
  POMOGATOR_021_URL: https://sobaca0808-bit.github.io/pomogator/preview-v0.2.1/

jobs:
  build:
    if: github.ref == 'refs/heads/organizer-v0.2-pages'
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.source.outputs.sha }}
      version: ${{ steps.package.outputs.version }}
      preview: ${{ steps.source.outputs.preview }}
      center: ${{ steps.source.outputs.center }}
      glass: ${{ steps.source.outputs.glass }}
      redesign: ${{ steps.source.outputs.redesign }}
    steps:
      - name: Select the current source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.source_sha }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$POMOGATOR_SOURCE_BRANCH" --jq .object.sha)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          if [[ -n "$REQUESTED" && "$REQUESTED" != "$sha" ]]; then
            echo "::error::The requested source is no longer the tip of $POMOGATOR_SOURCE_BRANCH."
            exit 1
          fi
          preview=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/organizer-v0.2.1-preview" --jq .object.sha)
          [[ "$preview" =~ ^[a-f0-9]{40}$ ]]
          center=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/organizer-v0.2.2-preview" --jq .object.sha)
          [[ "$center" =~ ^[a-f0-9]{40}$ ]]
          glass=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/organizer-v0.2.3-preview" --jq .object.sha)
          [[ "$glass" =~ ^[a-f0-9]{40}$ ]]
          redesign=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/organizer-v0.2.4-preview" --jq .object.sha)
          [[ "$redesign" =~ ^[a-f0-9]{40}$ ]]
          echo "redesign=$redesign" >> "$GITHUB_OUTPUT"
          echo "glass=$glass" >> "$GITHUB_OUTPUT"
          echo "center=$center" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the preview with its existing storage and address
        id: package
        env:
          VITE_POMOGATOR_STORAGE: pomogator-v02-pages
          VITE_POMOGATOR_PAGES: 'true'
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          npm run build -- --base=./
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p site/preview-v0.2
          cp -a dist/. site/preview-v0.2/
          sed -i "s@</head>@<meta name=\"pomogator-build\" content=\"$SOURCE_SHA\" /></head>@" site/preview-v0.2/index.html
          jq -n --arg commit "$SOURCE_SHA" --arg version "$VERSION" '{commit:$commit,version:$version}' > site/preview-v0.2/build.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.preview }}
          path: preview-source
          persist-credentials: false
      - name: Build the separately tested 0.2.1 preview
        working-directory: preview-source
        env:
          VITE_POMOGATOR_STORAGE: pomogator-v021-pages
          VITE_POMOGATOR_PAGES: 'true'
          PREVIEW_SHA: ${{ steps.source.outputs.preview }}
        run: |
          npm ci
          npm run build -- --base=./
          VERSION=$(node -p 'require("./package.json").version')
          test "$VERSION" = 0.2.1
          dest=../site/preview-v0.2.1
          mkdir -p "$dest"
          cp -a dist/. "$dest/"
          sed -i "s@</head>@<meta name=\"pomogator-build\" content=\"$PREVIEW_SHA\" /></head>@" "$dest/index.html"
          jq -n --arg commit "$PREVIEW_SHA" --arg version "$VERSION" '{commit:$commit,version:$version}' > "$dest/build.json"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.center }}
          path: center-source
          persist-credentials: false
      - name: Build the 0.2.2 preview with separate storage
        working-directory: center-source
        env:
          VITE_POMOGATOR_STORAGE: pomogator-v022-pages
          VITE_POMOGATOR_PAGES: 'true'
          PREVIEW_SHA: ${{ steps.source.outputs.center }}
        run: |
          npm ci
          npm run build -- --base=./
          VERSION=$(node -p 'require("./package.json").version')
          test "$VERSION" = 0.2.2
          dest=../site/preview-v0.2.2
          mkdir -p "$dest"
          cp -a dist/. "$dest/"
          sed -i "s@</head>@<meta name=\"pomogator-build\" content=\"$PREVIEW_SHA\" /></head>@" "$dest/index.html"
          jq -n --arg commit "$PREVIEW_SHA" --arg version "$VERSION" '{commit:$commit,version:$version}' > "$dest/build.json"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.glass }}
          path: glass-source
          persist-credentials: false
      - name: Build the 0.2.3 preview with separate storage
        working-directory: glass-source
        env:
          VITE_POMOGATOR_STORAGE: pomogator-v023-pages
          VITE_POMOGATOR_PAGES: 'true'
          PREVIEW_SHA: ${{ steps.source.outputs.glass }}
        run: |
          npm ci
          npm run build -- --base=./
          VERSION=$(node -p 'require("./package.json").version')
          test "$VERSION" = 0.2.3
          dest=../site/preview-v0.2.3
          mkdir -p "$dest"
          cp -a dist/. "$dest/"
          sed -i "s@</head>@<meta name=\"pomogator-build\" content=\"$PREVIEW_SHA\" /></head>@" "$dest/index.html"
          jq -n --arg commit "$PREVIEW_SHA" --arg version "$VERSION" '{commit:$commit,version:$version}' > "$dest/build.json"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.redesign }}
          path: redesign-source
          persist-credentials: false
      - name: Build the 0.2.4 preview with separate storage
        working-directory: redesign-source
        env:
          VITE_POMOGATOR_STORAGE: pomogator-v024-pages
          VITE_POMOGATOR_PAGES: 'true'
          PREVIEW_SHA: ${{ steps.source.outputs.redesign }}
        run: |
          npm ci
          npm run build -- --base=./
          VERSION=$(node -p 'require("./package.json").version')
          test "$VERSION" = 0.2.4
          dest=../site/preview-v0.2.4
          mkdir -p "$dest"
          cp -a dist/. "$dest/"
          sed -i "s@</head>@<meta name=\"pomogator-build\" content=\"$PREVIEW_SHA\" /></head>@" "$dest/index.html"
          jq -n --arg commit "$PREVIEW_SHA" --arg version "$VERSION" '{commit:$commit,version:$version}' > "$dest/build.json"
      - name: Capture the 0.2.3 and 0.2.4 main screens on the same data
        working-directory: redesign-source
        env:
          POMOGATOR_EVIDENCE_ROOT: ${{ github.workspace }}/site
          POMOGATOR_EVIDENCE_DIR: ${{ github.workspace }}/site/preview-v0.2.4/evidence
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- e2e/home-evidence.spec.ts
      - uses: actions/checkout@v4
        with:
          path: pages-tools
          persist-credentials: false
      - name: Save a synthetic folder and the current cached HTML before deployment
        working-directory: pages-tools
        run: |
          npm ci
          node e2e/pages-upgrade.mjs capture "$RUNNER_TEMP/pages-before.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pages-before-upgrade
          path: ${{ runner.temp }}/pages-before.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ env.POMOGATOR_PAGES_URL }}
    permissions:
      pages: write
      id-token: write
      deployments: read
    steps:
      - name: Verify existing Pages configuration and protect the main site
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ github.repository }}
          PREVIEW_COMMIT: ${{ needs.build.outputs.source }}
          PREVIEW_021_COMMIT: ${{ needs.build.outputs.preview }}
          PREVIEW_022_COMMIT: ${{ needs.build.outputs.center }}
          PREVIEW_023_COMMIT: ${{ needs.build.outputs.glass }}
          PREVIEW_024_COMMIT: ${{ needs.build.outputs.redesign }}
        run: |
          latest=$(gh api "repos/$PROJECT/git/ref/heads/$POMOGATOR_SOURCE_BRANCH" --jq .object.sha)
          if [[ "$latest" != "$PREVIEW_COMMIT" ]]; then
            echo "::error::A newer source revision is available. This build will not replace it."
            exit 1
          fi
          latest_preview=$(gh api "repos/$PROJECT/git/ref/heads/organizer-v0.2.1-preview" --jq .object.sha)
          test "$latest_preview" = "$PREVIEW_021_COMMIT"
          latest_center=$(gh api "repos/$PROJECT/git/ref/heads/organizer-v0.2.2-preview" --jq .object.sha)
          test "$latest_center" = "$PREVIEW_022_COMMIT"
          latest_glass=$(gh api "repos/$PROJECT/git/ref/heads/organizer-v0.2.3-preview" --jq .object.sha)
          test "$latest_glass" = "$PREVIEW_023_COMMIT"
          latest_redesign=$(gh api "repos/$PROJECT/git/ref/heads/organizer-v0.2.4-preview" --jq .object.sha)
          test "$latest_redesign" = "$PREVIEW_024_COMMIT"
          pages=$(gh api "repos/$PROJECT/pages")
          jq -e --arg root "$PAGES_ROOT" '.build_type == "workflow" and .html_url == $root and .cname == null and .https_enforced' <<< "$pages" > /dev/null
          root_status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$PAGES_ROOT")
          if [[ "$root_status" != 404 ]]; then
            echo "::error::The Pages root returned HTTP $root_status. Publishing would replace an existing site."
            exit 1
          fi
          deployments=$(gh api --paginate "repos/$PROJECT/deployments?environment=github-pages&per_page=100" \
            --jq '.[] | select(.ref != "organizer-v0.2-pages") | .id')
          for deployment in $deployments; do
            successes=$(gh api --paginate "repos/$PROJECT/deployments/$deployment/statuses?per_page=100" \
              --jq '.[] | select(.state == "success") | .id')
            if [[ -n "$successes" ]]; then
              echo "::error::A prior Pages deployment succeeded. Its files must be retained before using this publication."
              exit 1
            fi
          done
          echo "Pages root HTTP 404, no prior successful main deployment, preview commit $PREVIEW_COMMIT."
      - uses: actions/deploy-pages@v4

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: pages-before-upgrade
          path: ${{ runner.temp }}/pages-before
      - name: Verify live HTTPS at a mobile viewport and confirm the upgrade
        env:
          EXPECTED_COMMIT: ${{ needs.build.outputs.source }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          POMOGATOR_CURRENT_PREVIEW: '1'
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            --max-time 20 --output /dev/null "$POMOGATOR_PAGES_URL"
          for attempt in {1..24}; do
            actual=$(curl -fsS --max-time 10 "${POMOGATOR_PAGES_URL}build.json?v=$EXPECTED_COMMIT" | jq -r .commit || true)
            html=$(curl -fsS --max-time 10 "$POMOGATOR_PAGES_URL" || true)
            [[ "$actual" == "$EXPECTED_COMMIT" && "$html" == *"$EXPECTED_COMMIT"* ]] && break
            sleep 10
          done
          test "$actual" = "$EXPECTED_COMMIT"
          [[ "$html" == *"$EXPECTED_COMMIT"* ]]
          node e2e/pages-smoke.mjs
          node e2e/pages-upgrade.mjs verify "$RUNNER_TEMP/pages-before/pages-before.json"
          status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$PAGES_ROOT")
          test "$status" = 404
          echo "Pages root still returns HTTP 404."

      - name: Verify the separately published preview and storage isolation
        env:
          POMOGATOR_PAGES_URL: ${{ env.POMOGATOR_021_URL }}
          POMOGATOR_DATABASE: pomogator-v021-pages
          POMOGATOR_V01_URL: ${{ env.POMOGATOR_PAGES_URL }}
          POMOGATOR_PREVIOUS_DATABASE: pomogator-v02-pages
          EXPECTED_COMMIT: ${{ needs.build.outputs.preview }}
          EXPECTED_VERSION: '0.2.1'
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 7 --retry-all-errors \
            --max-time 20 --output /dev/null "${POMOGATOR_PAGES_URL}build.json?v=$EXPECTED_COMMIT"
          node e2e/pages-smoke.mjs

      - name: Verify 0.2.2 and its isolation from the previous preview
        env:
          POMOGATOR_PAGES_URL: ${{ env.POMOGATOR_022_URL }}
          POMOGATOR_DATABASE: pomogator-v022-pages
          POMOGATOR_V01_URL: ${{ env.POMOGATOR_021_URL }}
          POMOGATOR_PREVIOUS_DATABASE: pomogator-v021-pages
          EXPECTED_COMMIT: ${{ needs.build.outputs.center }}
          EXPECTED_VERSION: '0.2.2'
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 7 --retry-all-errors \
            --max-time 20 --output /dev/null "${POMOGATOR_PAGES_URL}build.json?v=$EXPECTED_COMMIT"
          node e2e/pages-smoke.mjs

      - name: Verify 0.2.3 and its isolation from the previous preview
        env:
          POMOGATOR_PAGES_URL: ${{ env.POMOGATOR_023_URL }}
          POMOGATOR_DATABASE: pomogator-v023-pages
          POMOGATOR_V01_URL: ${{ env.POMOGATOR_022_URL }}
          POMOGATOR_PREVIOUS_DATABASE: pomogator-v022-pages
          EXPECTED_COMMIT: ${{ needs.build.outputs.glass }}
          EXPECTED_VERSION: '0.2.3'
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 7 --retry-all-errors \
            --max-time 20 --output /dev/null "${POMOGATOR_PAGES_URL}build.json?v=$EXPECTED_COMMIT"
          node e2e/pages-smoke.mjs

      - name: Verify 0.2.4 and its isolation from the previous preview
        env:
          POMOGATOR_PAGES_URL: ${{ env.POMOGATOR_024_URL }}
          POMOGATOR_DATABASE: pomogator-v024-pages
          POMOGATOR_V01_URL: ${{ env.POMOGATOR_023_URL }}
          POMOGATOR_PREVIOUS_DATABASE: pomogator-v023-pages
          EXPECTED_COMMIT: ${{ needs.build.outputs.redesign }}
          EXPECTED_VERSION: '0.2.4'
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 7 --retry-all-errors \
            --max-time 20 --output /dev/null "${POMOGATOR_PAGES_URL}build.json?v=$EXPECTED_COMMIT"
          node e2e/pages-smoke.mjs
          for file in index.html before-dark-390.jpg after-dark-390.jpg after-light-390.jpg after-dark-1366.jpg; do
            curl -fsS --max-time 20 --output /dev/null "${POMOGATOR_PAGES_URL}evidence/$file"
          done

      - name: Write the test report
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.source }}
          BUILD_RUN: ${{ inputs.build_run }}
          WINDOWS_ZIP: ${{ inputs.windows_zip }}
        run: |
          {
            echo "### ПОМОГАТОР $VERSION"
            echo "- Изменения и точная ревизия · [$SOURCE_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$SOURCE_SHA)"
            echo "- Проверки · сборка, модульные тесты и проверка опубликованного HTTPS, установки и сохранения карточек"
            echo "- [Мобильный стенд]($POMOGATOR_PAGES_URL)"
            echo "- [Отдельный стенд 0.2.1]($POMOGATOR_021_URL)"
            echo "- [Отдельный стенд 0.2.2]($POMOGATOR_022_URL)"
            echo "- [Отдельный стенд 0.2.3]($POMOGATOR_023_URL)"
            echo "- [Отдельный стенд 0.2.4]($POMOGATOR_024_URL)"
            echo "- [Сравнение главного экрана](${POMOGATOR_024_URL}evidence/)"
            if [[ "$BUILD_RUN" =~ ^[0-9]+$ && "$WINDOWS_ZIP" =~ ^[0-9]+$ ]]; then
              echo "- [ZIP Windows x64](https://github.com/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/artifacts/$WINDOWS_ZIP)"
            fi
            echo "- [Рабочая ветка](https://github.com/$GITHUB_REPOSITORY/tree/$POMOGATOR_SOURCE_BRANCH)"
          } >> "$GITHUB_STEP_SUMMARY"

  android-install:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installability in Android Chrome
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: node e2e/pages-smoke.mjs
        env:
          POMOGATOR_ANDROID: '1'
          POMOGATOR_CURRENT_PREVIEW: '1'
          POMOGATOR_V01_URL: ${{ env.POMOGATOR_024_URL }}
          POMOGATOR_PREVIOUS_DATABASE: pomogator-v024-pages
          EXPECTED_COMMIT: ${{ needs.build.outputs.source }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
