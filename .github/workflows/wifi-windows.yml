name: ПОМОГАТОР Wi-Fi · Windows x64

on:
  push:
    branches: [wifi-v0.2.0, wifi-client-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wifi-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test ownership, Hosted Network and ICS policies
        run: dotnet run --project windows/wifi/tests/PolicyTests.csproj -c Release
      - name: Build Windows x64
        run: dotnet build windows/wifi/PomogatorWifi.csproj -c Release
      - name: Test WinForms, tray, startup and DPAPI
        shell: pwsh
        run: |
          dotnet build windows/wifi/tests/ui/WifiUiTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & windows/wifi/tests/ui/bin/Release/net48/WifiUiTests.exe screenshots
          exit $LASTEXITCODE
      - name: Package trial build
        shell: pwsh
        run: |
          New-Item -ItemType Directory bundle
          Copy-Item windows/wifi/bin/Release/net48/PomogatorWifi.exe bundle/
          Copy-Item windows/wifi/README.md bundle/
          Get-FileHash bundle/PomogatorWifi.exe -Algorithm SHA256 |
            ForEach-Object { $_.Hash + '  PomogatorWifi.exe' } |
            Set-Content bundle/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PomogatorWifi-0.2.4-win-x64
          path: bundle/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PomogatorWifi-0.2.4-screenshots
          path: screenshots/
          if-no-files-found: error
